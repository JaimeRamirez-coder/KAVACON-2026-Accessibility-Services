plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kavacon.walletsecure'
    compileSdk 34

    defaultConfig {
        applicationId "com.kavacon.walletsecure"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    // Storage cifrado (reemplaza SharedPreferences en claro de WalletVulnerable)
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
